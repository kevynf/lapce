name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the Windows release"
        required: true
        type: string

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    env:
      RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: rustup update --no-self-update

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --frozen --profile release-lto --bin lapce

      - name: Create portable archive
        shell: pwsh
        run: |
          cargo build --frozen --profile release-lto --features lapce-app/portable --bin lapce
          Compress-Archive ./target/release-lto/lapce.exe ./Lapce-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lapce-windows
          path: |
            ./Lapce-windows-portable.zip
          retention-days: 1

  publish:
    name: Publish Windows release
    needs: windows
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Publish release
        run: |
          gh release create "$RELEASE_TAG_NAME" \
            --title "$RELEASE_TAG_NAME" \
            --target "$GITHUB_SHA" \
            lapce-windows/*
